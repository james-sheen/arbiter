[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arbiter-engine"
version = "0.1.0"
description = "A detection engine that reports what it did not check."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pyyaml>=6.0",
]

# MEASURED, not read off the import list: without these the public API
# still imports. scipy is reached only via propagation.lp_confidence and
# rdflib only via ontology.loader -- both deep paths, both unsupported.
[project.optional-dependencies]
rdf = ["rdflib>=6.0"]
confidence = ["scipy>=1.7"]
mcp = ["mcp>=1.0"]
all = ["rdflib>=6.0", "scipy>=1.7", "mcp>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["arbiter_engine"]
