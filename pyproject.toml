[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arbiter-engine"
version = "0.1.0"
description = "A detection engine that reports what it did not check."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
readme = "README.md"
dependencies = [
    "numpy>=1.21",
    "pyyaml>=6.0",
]

# MEASURED, not read off the import list: without these the public API
# still imports. scipy is reached only via propagation.lp_confidence and
# rdflib only via ontology.loader -- both deep paths, both unsupported.
[project.optional-dependencies]
rdf = ["rdflib>=6.0"]
confidence = ["scipy>=1.7"]
mcp = ["mcp>=1.0"]
all = ["rdflib>=6.0", "scipy>=1.7", "mcp>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["arbiter_engine"]
