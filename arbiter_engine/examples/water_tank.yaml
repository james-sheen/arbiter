# A worked example: a two-tank water system.
#
# Deliberately synthetic. It is here to teach the schema and to give the engine
# something to run against out of the box -- it is NOT one of the curated
# domain models, which are not published. Every one of the eight axioms is
# declared at least once below, so this file doubles as the schema reference.

domain:
  id: water-tank
  name: Two-Tank Water System
  description: >
    A supply tank feeding a header tank through a pump, with a controller
    holding the header level at setpoint. Small enough to read in one sitting.

  entity_types:
    - Tank
    - Pump
    - Controller

  relationship_types:
    - feeds
    - controls

  indicators:
    Tank:
      # BOUNDEDNESS -- a ceiling. `lower_warning:` / `lower_critical:` declare a
      # floor as well; see the Pump's speed_rpm below for both on one indicator.
      # A tank has no interesting floor -- an empty supply tank is a fact about
      # the process, not a fault -- so this one declares only the ceiling.
      - name: level_pct
        type: NUMERIC
        axioms: [BOUNDEDNESS, HOMEOSTASIS]
        warning: 85
        critical: 95
        window: 1h

      # CONSERVATION -- what flows in should leave or accumulate. The nested
      # block is what makes this configurable from YAML at all.
      #
      # `flow:` is the SECOND declaration, and the two answer different
      # questions. `conservation:` tells the per-indicator checker which
      # properties to sum against which. `flow:` tells the traversal kernel,
      # which walks flow CYCLES through the topology and has no indicator in
      # hand, which side of a balance a quantity sits on. That kernel used to
      # answer it by reading the property NAME -- so `bad_actor_input` was an
      # inflow -- and since it answers it only from here. Undeclared
      # means the cycle balance is not computed and the omission is reported
      # as a gap.
      - name: inflow_lps
        type: NUMERIC
        axioms: [CONSERVATION]
        window: 15m
        flow: in
        conservation:
          input_property: inflow_lps
          output_properties: [outflow_lps]
          loss_margin: 0.05

      # Note this side declares `flow:` and no axiom. It is named inside the
      # block above, so the checker already reads it; what it needs to say
      # for itself is which direction it points. Requiring an axiom here to
      # accept that would be demanding a declaration the model does not mean.
      - name: outflow_lps
        type: NUMERIC
        axioms: []          # observation-only: recorded, never checked per cycle
        flow: out

      # CONSISTENCY -- two questions, and this indicator asks both.
      #
      # The role rule is single-value: `role: percentage` range-checks this
      # reading against 0-100 and would behave identically if `level_pct` were
      # deleted from the model. That was the ONLY rule until, and this
      # comment said `two independent readings that should agree` until
      # 2026-08-16 -- the reading the use-case catalogue carried in eleven
      # places, and the reason both were reported from outside on the same day.
      #
      # The `consistency:` block below is the second rule and the one the name
      # always promised: these two level sensors are DECLARED redundant, so a
      # divergence past the tolerance is a finding. Declared, because nothing
      # about two numbers reveals that they measure the same thing -- the same
      # argument `expect_variation` and `role:` make. Delete the block and this
      # indicator goes back to being range-checked alone.
      #
      # `role: percentage` selects the 0-100 rule. Without it the engine would
      # infer the same thing from the `pct` token in the name, which is how
      # this line worked before the field existed -- correctly, and by accident.
      - name: level_pct_redundant
        type: NUMERIC
        role: percentage
        axioms: [CONSISTENCY]
        window: 15m
        # Declared on ONE side only. The comparison is symmetric -- the
        # tolerance is relative to the larger of the two readings, so it does
        # not matter which sensor carries the block -- and declaring it on both
        # would report the same divergence twice.
        consistency:
          agrees_with: [level_pct]
          tolerance: 0.02       # 2% between two sensors on the same tank

    Pump:
      # STABILITY -- does it settle, or hunt?
      #
      # `expect_variation: true` asserts that a running pump's speed is a LIVE
      # measurement, so a reading that never moves across the window is a dead
      # sensor rather than a very steady pump. Without it the engine says
      # nothing, and that silence is deliberate: whether a flat series is a
      # fault is a question about the domain, not about the number. A setpoint,
      # a replica count and a switched-off pump are all correctly constant, and
      # the checker has no way to tell those from a frozen probe. The model
      # does. Leave the field out and nothing changes.
      # BOUNDEDNESS -- and a band, not just a ceiling.
      #
      # A pump has both: it must not run away, and it must not stall. The floor
      # keys are separate from `direction:` deliberately -- that field selects
      # which side HOMEOSTASIS fires on and has never had anything to do with
      # thresholds, and a single direction switch could not express a band at
      # all.
      #
      # Declare a floor when a datasheet or a contract gave you the number.
      # Where nobody has published one -- accuracy, satisfaction, margin -- a
      # floor is a guess wearing a threshold's clothes, and HOMEOSTASIS against
      # a baseline is the right shape. MODELING.md carries the full rule.
      - name: speed_rpm
        type: NUMERIC
        axioms: [STABILITY, BOUNDEDNESS]
        lower_critical: 900     # below this the pump has stalled
        lower_warning: 1200
        warning: 2800
        critical: 3200
        window: 30m
        expect_variation: true

      # MONOTONICITY -- a lifetime counter may only rise. allow_reset covers
      # the genuine restart case rather than treating it as a violation.
      - name: run_hours_total
        type: NUMERIC
        axioms: [MONOTONICITY]
        window: 24h
        monotonicity:
          expected_direction: increasing
          allow_reset: true

      # CONNECTIVITY -- a pump with nothing to feed is a modelling error.
      - name: feeds_a_tank
        type: RELATIONSHIP
        axioms: [CONNECTIVITY]
        target_type: Tank
        relation_type: feeds
        min_cardinality: 1
        max_cardinality: 2
        violation_severity: HIGH

    Controller:
      # RESPONSIVENESS -- a latency judged against its thresholds.
      #
      # This block declared `timeout: 10m` until 2026-08-16, above a comment
      # calling the deadline part of the claim. Nothing read it: `timeout:`
      # loads into `transient_timeout`, which only STABILITY reads, and only
      # for a STATE indicator declaring `transient:` states. On a numeric
      # latency it was inert. RESPONSIVENESS judges the value against
      # `warning:` and `critical:` below, and those ARE the deadline.
      #
      # Found by `model_describe(s)` on the run of its own new check, not by
      # anyone reading the file -- which is the whole argument for the check.
      #
      # `role:` IS WHAT MAKES THIS EVALUATE. RESPONSIVENESS and CONSISTENCY are
      # about a KIND of quantity -- a latency, a count, a percentage, a ratio --
      # so the model says which, and the checker no longer has to guess from
      # English. Leave `role:` out and the engine still infers one from the
      # name, so older models keep working; but an indicator whose name carries
      # no recognised word then declines `not_applicable` while the pass stays
      # green.
      #
      # This file worked around that by RENAMING: it read `setpoint_error_pct`
      # until 2026-08-14, which could never fire, and was then renamed to
      # `setpoint_response_error_pct` so the guess would land. Renaming a domain
      # concept to satisfy a checker is the wrong remedy, and the name is back.
      # `model_describe(s)` lists any declaration that cannot fire, so this is
      # answerable without running a cycle.
      # HOMEOSTASIS here reads a DECLARED setpoint rather than a learned one,
      # and this indicator is the clearest case for it: a control error is
      # supposed to sit at zero, which is a fact about the controller and not
      # something to be inferred from where the error has recently been.
      #
      # The learned baseline is still the default everywhere else, and it is
      # what the axiom means. Its limit is that the baseline window CONTAINS
      # the deviation, so a fault that persists is absorbed into its own
      # reference and the score decays until the axiom falls silent — measured
      # at roughly fifteen samples on a 60-second series. A declared setpoint
      # cannot be absorbed, because nothing about a number the operator wrote
      # moves when the reading does. See.
      #
      # `tolerance` is the warning band in the property's own units; critical
      # defaults to twice it unless `tolerance_critical` says otherwise. A
      # setpoint declared without a tolerance is refused rather than given one.
      - name: setpoint_error_pct
        type: NUMERIC
        role: latency
        axioms: [RESPONSIVENESS, HOMEOSTASIS]
        warning: 5
        critical: 12
        window: 30m
        homeostasis:
          setpoint: 0
          tolerance: 5
