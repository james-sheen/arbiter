# A worked example: a two-tank water system.
#
# Deliberately synthetic. It is here to teach the schema and to give the engine
# something to run against out of the box -- it is NOT one of the curated
# domain models, which are not published. Every one of the eight axioms is
# declared at least once below, so this file doubles as the schema reference.

domain:
  id: water-tank
  name: Two-Tank Water System
  description: >
    A supply tank feeding a header tank through a pump, with a controller
    holding the header level at setpoint. Small enough to read in one sitting.

  entity_types:
    - Tank
    - Pump
    - Controller

  relationship_types:
    - feeds
    - controls

  indicators:
    Tank:
      # BOUNDEDNESS -- an upper bound. Thresholds are upper bounds ONLY; for a
      # lower-is-worse quantity use HOMEOSTASIS against a baseline instead.
      - name: level_pct
        type: NUMERIC
        axioms: [BOUNDEDNESS, HOMEOSTASIS]
        warning: 85
        critical: 95
        window: 1h

      # CONSERVATION -- what flows in should leave or accumulate. The nested
      # block is what makes this configurable from YAML at all.
      - name: inflow_lps
        type: NUMERIC
        axioms: [CONSERVATION]
        window: 15m
        conservation:
          input_property: inflow_lps
          output_properties: [outflow_lps]
          loss_margin: 0.05

      - name: outflow_lps
        type: NUMERIC
        axioms: []          # observation-only: recorded, never checked per cycle

      # CONSISTENCY -- is this value possible on its own terms?
      #
      # NOT a comparison against `level_pct`, despite the name. CONSISTENCY
      # reads ONE indicator and range-checks it against what its role permits,
      # and this block would behave identically if `level_pct` were deleted
      # from the model. This comment said `two independent readings that should
      # agree` until 2026-08-16, which is the reading the use-case catalogue
      # carried in eleven places and the reason both were reported from
      # outside on the same day. To compare two readings, compute the
      # difference in your adapter and give the engine that.
      #
      # `role: percentage` selects the 0-100 rule. Without it the engine would
      # infer the same thing from the `pct` token in the name, which is how
      # this line worked before the field existed -- correctly, and by accident.
      - name: level_pct_redundant
        type: NUMERIC
        role: percentage
        axioms: [CONSISTENCY]
        window: 15m

    Pump:
      # STABILITY -- does it settle, or hunt?
      #
      # `expect_variation: true` asserts that a running pump's speed is a LIVE
      # measurement, so a reading that never moves across the window is a dead
      # sensor rather than a very steady pump. Without it the engine says
      # nothing, and that silence is deliberate: whether a flat series is a
      # fault is a question about the domain, not about the number. A setpoint,
      # a replica count and a switched-off pump are all correctly constant, and
      # the checker has no way to tell those from a frozen probe. The model
      # does. Leave the field out and nothing changes.
      - name: speed_rpm
        type: NUMERIC
        axioms: [STABILITY, BOUNDEDNESS]
        warning: 2800
        critical: 3200
        window: 30m
        expect_variation: true

      # MONOTONICITY -- a lifetime counter may only rise. allow_reset covers
      # the genuine restart case rather than treating it as a violation.
      - name: run_hours_total
        type: NUMERIC
        axioms: [MONOTONICITY]
        window: 24h
        monotonicity:
          expected_direction: increasing
          allow_reset: true

      # CONNECTIVITY -- a pump with nothing to feed is a modelling error.
      - name: feeds_a_tank
        type: RELATIONSHIP
        axioms: [CONNECTIVITY]
        target_type: Tank
        relation_type: feeds
        min_cardinality: 1
        max_cardinality: 2
        violation_severity: HIGH

    Controller:
      # RESPONSIVENESS -- a latency judged against its thresholds.
      #
      # This block declared `timeout: 10m` until 2026-08-16, above a comment
      # calling the deadline part of the claim. Nothing read it: `timeout:`
      # loads into `transient_timeout`, which only STABILITY reads, and only
      # for a STATE indicator declaring `transient:` states. On a numeric
      # latency it was inert. RESPONSIVENESS judges the value against
      # `warning:` and `critical:` below, and those ARE the deadline.
      #
      # Found by `model_describe(s)` on the run of its own new check, not by
      # anyone reading the file -- which is the whole argument for the check.
      #
      # `role:` IS WHAT MAKES THIS EVALUATE. RESPONSIVENESS and CONSISTENCY are
      # about a KIND of quantity -- a latency, a count, a percentage, a ratio --
      # so the model says which, and the checker no longer has to guess from
      # English. Leave `role:` out and the engine still infers one from the
      # name, so older models keep working; but an indicator whose name carries
      # no recognised word then declines `not_applicable` while the pass stays
      # green.
      #
      # This file worked around that by RENAMING: it read `setpoint_error_pct`
      # until 2026-08-14, which could never fire, and was then renamed to
      # `setpoint_response_error_pct` so the guess would land. Renaming a domain
      # concept to satisfy a checker is the wrong remedy, and the name is back.
      # `model_describe(s)` lists any declaration that cannot fire, so this is
      # answerable without running a cycle.
      - name: setpoint_error_pct
        type: NUMERIC
        role: latency
        axioms: [RESPONSIVENESS, HOMEOSTASIS]
        warning: 5
        critical: 12
        window: 30m
