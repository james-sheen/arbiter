# Runs the published package, on a machine that is not the maintainer's.
#
# Every other verification claim in this repository is a report: the dependency
# count, the import count, what a tag names. A reader can only take those on
# trust, which is an odd thing to ask from a project whose whole argument is
# that a clean pass should be checkable rather than believed. This workflow is
# the part a reader can check without believing anything, because it installs
# from the index like anyone else and runs what the README tells them to run.
#
# It restates nothing. The command it executes and the output it expects are
# both READ OUT OF THE README, so there is no second copy to drift from the
# first. If the README is wrong, this goes red; that is the point.
#
# NOT on push, deliberately. The index needs minutes to propagate a new release
# and a push-triggered run would be red on every release day for a reason that
# is not a defect. A check that is red for a good reason on a predictable
# schedule teaches people to ignore it, and an ignored check is worse than none.

name: verify published

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags, so the released version can be located

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install from the index
        run: pip install arbiter-engine

      - name: The tag must name the tree the release was built from
        run: |
          V=$(python -c "import importlib.metadata as m; print(m.version('arbiter-engine'))")
          echo "index has $V"
          git rev-parse "v$V" >/dev/null 2>&1 || {
            echo "::error::no tag v$V; the released version names no tree"
            exit 1
          }
          DECLARED=$(git show "v$V:pyproject.toml" | grep -m1 '^version' | cut -d'"' -f2)
          [ "$DECLARED" = "$V" ] || {
            echo "::error::tag v$V holds a tree declaring $DECLARED"
            exit 1
          }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      # Asked for by a reader who counted the decline sites by hand, found the
      # README's number stale, and pointed out that deriving it would make the
      # drift impossible rather than repeatedly corrected. They were right, and
      # the reason is sharper than it looked: a check that derives this number
      # already existed and had been SKIPPING, because it measured a build
      # directory that is not always there. A gate that did not run is not a
      # gate that passed. Here there is nothing to skip -- the checkers ship
      # inside the wheel, so the package being installed is the measurement.
      #
      # Two claims, deliberately graded differently. The branch's README must
      # MATCH the installed package, and a mismatch fails. The README already
      # published alongside a release cannot be corrected in place, so a
      # mismatch there is a notice naming the next release as the remedy.
      # Failing on it would leave this red for a true thing nobody can fix
      # today, and a check that stays red teaches people to stop reading it.
      - name: The decline count, derived from the package rather than restated
        run: |
          python - <<'EOF'
          import importlib.util, os, pathlib, re, subprocess, sys
          ax = pathlib.Path(importlib.util.find_spec("arbiter_engine").origin).parent
          ax = ax / "ontology" / "axioms"
          eight = ["boundedness", "stability", "homeostasis", "monotonicity",
                   "conservation", "connectivity", "consistency", "responsiveness"]
          per = {n: len(re.findall(r"\.declined\(", (ax / f"{n}.py").read_text()))
                 for n in eight}
          total = sum(per.values())
          print(f"package: {per} -> {total}")

          def claimed(text):
              m = re.search(r"\((\d+) call sites\)", text)
              return int(m.group(1)) if m else None

          here = claimed(pathlib.Path("README.md").read_text())
          if here is None:
              print("::error::README no longer states a decline call-site count")
              sys.exit(1)
          if here != total:
              print(f"::error::README claims {here} decline sites; the package has {total}")
              sys.exit(1)
          print(f"the README on this branch matches the package at {total}")

          tag = os.environ["VERSION"]
          shipped = claimed(subprocess.run(["git", "show", f"v{tag}:README.md"],
                                           capture_output=True, text=True).stdout)
          if shipped != total:
              print(f"::notice::the README published with {tag} claims {shipped}, "
                    f"not {total}. An index page cannot be corrected in place; "
                    f"the next release carries the fix.")
          EOF

      - name: Check out the README that shipped with this version
        run: git checkout "v$VERSION" -- README.md

      - name: The documented quickstart, run verbatim
        run: |
          python - <<'EOF' > quickstart.sh
          import re, pathlib
          readme = pathlib.Path("README.md").read_text()
          after = readme.split("## Quickstart", 1)[1]
          block = re.search(r"```bash\n(.*?)```", after, re.S).group(1)
          pathlib.Path("expected.txt").write_text(
              re.search(r"`(\{[^`]*\})`", after[after.index("```", 8):]).group(1))
          print(block)
          EOF
          echo "--- running ---" && cat quickstart.sh
          bash quickstart.sh > actual.txt
          # Compared in python, not with `diff`. The first cut wrote the
          # expected value with no trailing newline and compared it against
          # command output that has one, so `diff` exited 1 on a CORRECT
          # artifact -- a check red for no reason at all, which is worse than
          # the release-day redness the schedule above exists to avoid. Caught
          # by running this against the index, not by reading it.
          python - <<'EOF'
          import pathlib, sys
          e = pathlib.Path("expected.txt").read_text().strip()
          a = pathlib.Path("actual.txt").read_text().strip()
          print(f"expected: {e}")
          print(f"actual  : {a}")
          if e.replace(" ", "") != a.replace(" ", ""):
              print("::error::the quickstart does not print what the README says")
              sys.exit(1)
          print("the quickstart prints what the README documents")
          EOF

      - name: Two dependencies, and nothing else
        run: |
          python -c "import numpy, yaml" || exit 1
          for extra in scipy rdflib; do
            if python -c "import $extra" 2>/dev/null; then
              echo "::error::$extra is present on a plain install; the README says two"
              exit 1
            fi
          done
          echo "numpy and pyyaml present; scipy and rdflib absent, as documented"
